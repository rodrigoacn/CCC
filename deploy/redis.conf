# ─────────────────────────────────────────────────────────────────────────────
#  VM4: Redis config for ClassExpress (sessions + polling cache)
#  Place at: /etc/redis/classexpress.conf
# ─────────────────────────────────────────────────────────────────────────────

# Network
bind 0.0.0.0
port 6379
protected-mode yes
requirepass CHANGE_ME_TO_A_STRONG_PASSWORD

# Memory: use 256MB for sessions + polling cache
maxmemory 256mb
maxmemory-policy allkeys-lru

# Persistence: RDB snapshots (lightweight, for crash recovery)
save 900 1
save 300 10
save 60 10000
dbfilename classexpress.rdb
dir /var/lib/redis

# Logging
loglevel notice
logfile /var/log/redis/classexpress.log

# Sessions: keys prefixed with "session:" expire after 24h
# Polling: keys prefixed with "poll:" expire after 1h (set in PHP code)
