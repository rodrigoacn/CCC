# ─────────────────────────────────────────────────────────────────────────────
#  VM1: Nginx Load Balancer + SSL Termination
#  Place at: /etc/nginx/sites-available/classexpress
# ─────────────────────────────────────────────────────────────────────────────

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

# Map for WebSocket upgrade proxying
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Upstream: web nodes
# Cutover a Go: point each node at the Go server port (8080) instead of Apache
# (:80), e.g. `server VM2_IP:8080;`. The Go binary now accepts the /CCC/ prefix.
upstream classexpress_backend {
    least_conn;
    server VM2_IP:80;
    server VM3_IP:80;
    keepalive 32;
}

server {
    listen 80;
    server_name classexpress.online www.classexpress.online;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name classexpress.online www.classexpress.online;

    # ── SSL (Let's Encrypt) ──────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/classexpress.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/classexpress.online/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── Security headers ─────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Static files (served directly from LB) ──────────────────────────
    location /CCC/styles.css {
        alias /var/www/classexpress/styles.css;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
    location /CCC/favico.svg {
        alias /var/www/classexpress/favico.svg;
        expires 30d;
    }
    location ~* \.(jpg|jpeg|png|gif|webp|svg|ico|woff2|woff|ttf)$ {
        proxy_pass http://classexpress_backend;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── API rate limiting ────────────────────────────────────────────────
    location /CCC/api_mobile.php {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://classexpress_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # ── Auth rate limiting (login/signup) ────────────────────────────────
    location ~ ^/CCC/(login|forgot_password|reset_password)\.php$ {
        limit_req zone=auth burst=3 nodelay;
        proxy_pass http://classexpress_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── MercadoPago webhook (no rate limit, must be reliable) ────────────
    location /CCC/mp_webhook.php {
        proxy_pass http://classexpress_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── WebSocket (WebRTC signaling + chat sala) ─────────────────────────
    location /CCC/ws/ {
        proxy_pass http://classexpress_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── Everything else ──────────────────────────────────────────────────
    location /CCC/ {
        proxy_pass http://classexpress_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # ── Root redirect ────────────────────────────────────────────────────
    location = / {
        return 302 /CCC/materias.php;
    }

    # ── Block dotfiles ───────────────────────────────────────────────────
    location ~ /\. {
        deny all;
    }

    # ── Gzip ─────────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;
}
