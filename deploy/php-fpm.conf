; ─────────────────────────────────────────────────────────────────────────────
;  VM2/VM3: PHP-FPM Pool for ClassExpress
;  Place at: /etc/php/8.0/fpm/pool.d/classexpress.conf
; ─────────────────────────────────────────────────────────────────────────────

[classexpress]
user = www-data
group = www-data
listen = /run/php/php8.0-fpm-classexpress.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Scale dynamically: 2 per CPU core, max 50
pm = dynamic
pm.max_children = 50
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500

; Logging
php_admin_value[error_log] = /var/log/php/classexpress-error.log
php_admin_flag[log_errors] = on

; Security
php_admin_value[open_basedir] = /var/www/classexpress:/tmp
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen
php_admin_flag[allow_url_fopen] = on
php_admin_flag[allow_url_include] = off

; Session
php_admin_value[session.save_handler] = files
; Note: Redis sessions are handled in PHP code (lib/RedisSession.php)
; This is the fallback if Redis is unavailable

; Timeouts
request_terminate_timeout = 60s
